---
title: Disable .NET CLI Telemetry
description: Disables .NET CLI telemetry for privacy
actions:
    # https://learn.microsoft.com/en-us/dotnet/core/tools/telemetry
    # Atlas 26H2 (B2-9): '/M' (machine), without it the variable only went to the TrustedInstaller/SYSTEM profile
  - !cmd: {command: 'setx /M DOTNET_CLI_TELEMETRY_OPTOUT 1'}
