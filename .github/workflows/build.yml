name: Validar y compilar

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar playbook.conf (reglas de AME Wizard)
        run: python tools/ame_conf_check.py src/playbook/playbook.conf

      - name: Validar YAML y tareas
        run: |
          pip install pyyaml
          python tools/validate_yaml.py src/playbook/Configuration

      - name: Validar sintaxis de PowerShell
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem src, tools -Recurse -Include *.ps1, *.psm1 | ForEach-Object {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $bad++; Write-Output "::error file=$($_.FullName)::$($errs[0].Message)" }
          }
          if ($bad) { throw "$bad archivos con errores de sintaxis" }

      - name: "Compilar el .apbx (contraseña del ZIP: malte)"
        shell: pwsh
        working-directory: src/playbook
        run: |
          $version = ([xml](Get-Content playbook.conf -Raw)).Playbook.Version
          $name = "Meridian-26H2-v$version"
          & ..\dependencies\local-build.ps1 -ReplaceOldPlaybook -AddLiveLog -DontOpenPbLocation -FileName $name
          if (!(Test-Path "$name.apbx")) { throw "No se generó $name.apbx" }
          New-Item ..\..\dist -ItemType Directory -Force | Out-Null
          Move-Item "$name.apbx" ..\..\dist\
          Copy-Item "..\release-zip\*" ..\..\dist\ -Recurse
          $hash = (Get-FileHash "..\..\dist\$name.apbx" -Algorithm SHA256).Hash
          "$hash  $name.apbx" | Set-Content -Encoding ascii "..\..\dist\$name.apbx.sha256"
          Write-Output "SHA256: $hash"
          "## $name.apbx`n`nSHA256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: Meridian-26H2
          path: dist/*
          if-no-files-found: error

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apbx
            dist/*.sha256
          body_path: .github/RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
